<!doctype html>
<html lang="el">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Edit Studio</title>
  <link rel="icon" href="/static/img/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
  <div id="app">
    <nav id="sidebar">
      <div class="brand">
        <img src="/static/img/icon.svg" alt="">
        <span>Edit Studio</span>
      </div>
      <div id="nav-links"></div>
      <div class="sidebar-foot">
        <div id="gpu-status"></div>
        <button id="lang-toggle" class="ghost small" type="button"></button>
      </div>
    </nav>
    <main id="page"></main>
    <aside id="jobs-panel" class="collapsed">
      <button id="jobs-toggle" type="button">
        <span class="jobs-toggle-label"></span>
        <span id="jobs-badge" class="badge hidden">0</span>
      </button>
      <div id="jobs-body"></div>
    </aside>
  </div>
  <div id="toasts"></div>
  <div id="modal-root"></div>
  <script type="module" src="/static/js/app.js"></script>
</body>
</html>
